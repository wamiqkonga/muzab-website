name: CI / CD — muzaborganics.com

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # 1. Test
  # ─────────────────────────────────────────
  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run tests
        run: npm test -- --runInBand --forceExit
        working-directory: server

  # ─────────────────────────────────────────
  # 2. Build frontend (storefront)
  # ─────────────────────────────────────────
  build-client:
    name: Build React storefront
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 1

  # ─────────────────────────────────────────
  # 3. Build admin panel (separate app)
  # ─────────────────────────────────────────
  build-admin:
    name: Build React admin panel
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      - name: Build
        run: npm run build
        working-directory: admin
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist/
          retention-days: 1

  # ─────────────────────────────────────────
  # 4. Deploy to MilesWeb via SSH (tar + scp, no rsync)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to muzaborganics.com
    runs-on: ubuntu-latest
    needs: [build-client, build-admin]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download storefront build
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/

      - name: Download admin build
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin/dist/

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -T 30 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Host ${{ secrets.SSH_HOST }}" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config

      # ── Deploy storefront ──
      - name: Deploy storefront
        run: |
          tar -czf storefront.tar.gz -C client/dist .
          scp -P ${{ secrets.SSH_PORT }} storefront.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/storefront.tar.gz
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ${{ secrets.STOREFRONT_PATH }} && \
             tar -xzf ~/storefront.tar.gz -C ${{ secrets.STOREFRONT_PATH }} && \
             rm ~/storefront.tar.gz"

      # ── Deploy admin panel (its own build now) ──
      - name: Deploy admin panel
        run: |
          tar -czf admin.tar.gz -C admin/dist .
          scp -P ${{ secrets.SSH_PORT }} admin.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/admin.tar.gz
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ${{ secrets.ADMIN_PATH }} && \
             tar -xzf ~/admin.tar.gz -C ${{ secrets.ADMIN_PATH }} && \
             rm ~/admin.tar.gz"

      # ── Deploy backend ──
      - name: Deploy backend
        run: |
          tar -czf backend.tar.gz -C server --exclude='node_modules' --exclude='tests' --exclude='.env' .
          scp -P ${{ secrets.SSH_PORT }} backend.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/backend.tar.gz
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ${{ secrets.API_PATH }} && \
             tar -xzf ~/backend.tar.gz -C ${{ secrets.API_PATH }} && \
             rm ~/backend.tar.gz"

      # ── Install dependencies & restart Node app ──
      - name: Install dependencies & restart app
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.API_PATH }} && install --omit=dev && \
             ${{ secrets.NODE_APP_RESTART_CMD }}"
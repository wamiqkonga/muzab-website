name: CI / CD — muzaborganics.com

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # 1. Test
  # ─────────────────────────────────────────
  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run tests
        run: npm test -- --runInBand --forceExit
        working-directory: server

  # ─────────────────────────────────────────
  # 2. Build frontend
  # ─────────────────────────────────────────
  build:
    name: Build React frontend
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 1

  # ─────────────────────────────────────────
  # 3. Deploy to MilesWeb via SSH
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to muzaborganics.com
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ── Deploy frontend (storefront) ──
      - name: Deploy storefront to public_html
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            client/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.STOREFRONT_PATH }}/

      # ── Deploy admin build to subdomain ──
      - name: Deploy admin panel to admin subdomain
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            client/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.ADMIN_PATH }}/

      # ── Deploy backend ──
      - name: Deploy backend to server
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='tests' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            server/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.API_PATH }}/

      # ── Install dependencies & restart Node app ──
      - name: Install dependencies & restart app
        run: |
          ssh -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.API_PATH }} && npm ci --omit=dev && \
             ${{ secrets.NODE_APP_RESTART_CMD }}"

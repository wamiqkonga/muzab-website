name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Run tests
        run: npm test -- --runInBand --forceExit
        working-directory: server

      - name: Install client deps
        run: npm ci
        working-directory: client

      - name: Build check
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: https://api.muzaborganics.com
